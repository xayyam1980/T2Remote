name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish result to build-output branch
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/
          cp app/build/outputs/apk/release/*.apk /tmp/out/T2Remote.apk 2>/dev/null || true
          echo "${{ steps.build.outcome }} $GITHUB_SHA" > /tmp/out/STATUS
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-output
          git rm -rfq .
          cp /tmp/out/* .
          git add -A
          git commit -qm "Build ${{ steps.build.outcome }} for $GITHUB_SHA"
          git push -f origin build-output
      - uses: actions/upload-artifact@v4
        with:
          name: T2Remote-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
